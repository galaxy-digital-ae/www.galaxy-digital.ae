server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the OpenShift Route's edge-TLS termination, nginx receives plain HTTP on :8080.
    # Default absolute redirects would leak "http://host:8080/..." (downgrades scheme, exposes port).
    # Emit relative redirects so the browser resolves them against the real https origin.
    absolute_redirect off;
    port_in_redirect off;

    # Long-cache fingerprinted assets, no-cache HTML
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Astro builds pages as /path/index.html — resolve clean URLs, with and without trailing slash
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
