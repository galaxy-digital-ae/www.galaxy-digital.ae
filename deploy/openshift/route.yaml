apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: www
  namespace: galaxydigital-www
  labels:
    app: galaxy-digital
  annotations:
    # cert-manager (openshift-routes) issues/renews a Let's Encrypt cert for this host.
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt
    cert-manager.io/renew-before: 24h
    external-dns.kubernetes.io/hostname: www.galaxy-digital.ae
spec:
  host: www.galaxy-digital.ae
  to:
    kind: Service
    name: galaxy-digital
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
