apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: galaxy-digital-build
  namespace: galaxydigital-www
  labels:
    app: galaxy-digital
spec:
  nodeSelector: null
  output:
    to:
      kind: ImageStreamTag
      name: galaxy-digital:latest
  postCommit: {}
  resources: {}
  runPolicy: Serial
  source:
    binary: {}
    type: Binary
  strategy:
    dockerStrategy:
      dockerfilePath: deploy/Containerfile
    type: Docker
